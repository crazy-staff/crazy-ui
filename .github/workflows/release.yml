name: Release

# On main: if there are pending changesets, open a "Version Packages" PR; otherwise publish any
# version of @crazy-staff/ui that isn't on npm yet, tag it and create a GitHub release.
# Publishing uses npm trusted publishing (OIDC): npmjs.com trusts this workflow file
# (crazy-staff/crazy-ui, release.yml), so no npm token is stored anywhere and every version gets
# provenance. Needs npm 11.5.1+ (Node 24) and `id-token: write`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Build the library
        run: bun run --filter @crazy-staff/ui build
      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bunx changeset version
          createGithubReleases: true
          commit: 'Version packages'
          title: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
